# Puerto propio: el 8080 del VPS lo usa otro proyecto
server:
  port: 8081
  # Registro de peticiones HTTP: URL, IP de origen, usuario, estado, duración y cliente.
  # %u es el usuario de Basic Auth (nunca la clave). Rota a diario y guarda 30 días.
  tomcat:
    accesslog:
      enabled: false
      directory: /opt/minihotel-siigo/logs
      prefix: access
      suffix: .log
      pattern: '%{yyyy-MM-dd HH:mm:ss}t %a %u "%r" %s %b %{ms}Tms "%{User-Agent}i"'
      max-days: 30
      # Sin búfer: cada petición se escribe al instante y se ve con tail -f
      buffered: false

spring:
  datasource:
    url: jdbc:h2:file:/opt/minihotel-siigo/data/sync_transactions;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

